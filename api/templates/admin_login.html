<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/shared.css"><style>
body{background:#f6f4ec;color:#12211b;font-family:Inter,system-ui,sans-serif;margin:0}main{max-width:520px;margin:6vh auto;padding:30px;background:white;border:1px solid #e4dfd1;border-radius:20px}
h1{font-size:26px;margin:12px 0}p{line-height:1.6;color:#53655d}label{display:block;margin:15px 0 6px;font-weight:600;font-size:14px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8ded9;border-radius:10px;font:inherit}button{background:#0f7a52;color:white;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer;margin-top:18px}button:disabled{opacity:.6}a{color:#0f7a52}.message{white-space:pre-wrap;margin-top:16px}nav{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:24px}@media(max-width:560px){main{margin:20px 12px;padding:22px}}
</style><title>Admin sign in — ApnaGhar</title></head><body><main><a href="/">ApnaGhar · Patna</a><h1>ApnaGhar admin</h1><p>Use the administrator credentials configured for this installation.</p>
<form id="login"><label for="username">Admin username</label><input id="username" required autocomplete="username"><label for="password">Admin password</label><input id="password" type="password" required autocomplete="current-password"><button id="submit">Admin sign in</button></form><p id="message" class="message" role="status"></p><nav><a href="/broker/login">Broker sign in</a><a href="/">Back to ApnaGhar</a></nav></main>
<script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;message.textContent='Signing in…';try{const response=await fetch('/admin/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(response.ok){localStorage.setItem('btok',data.token);location.replace('/admin');}else{message.textContent=typeof data.detail==='string'?data.detail:'Check your login details.';}}catch(error){message.textContent='Could not connect. Try again.';}finally{button.disabled=false;}});</script></body></html>
