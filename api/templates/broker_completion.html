<div class="card" style="max-width:650px;padding:28px">
<h2 style="margin-bottom:12px">Record a completed purchase or rental</h2>
<p style="line-height:1.7;color:var(--muted,#64748b);margin-bottom:22px">Use this only after the purchase or rental agreement is complete. The home will appear in the customer's My Properties page and will no longer be offered as available. This does not collect a payment or create a legal agreement.</p>
<form id="completion-form" style="display:grid;gap:12px">
<label for="completion-email">Customer's ApnaGhar sign-in email</label><input id="completion-email" class="input" type="email" autocomplete="off" required maxlength="254">
<label for="completion-type">Completed transaction</label><select id="completion-type" class="input" required><option value="purchase">Purchase</option><option value="rent">Rental</option></select>
<label for="completion-date">Completion date</label><input id="completion-date" class="input" type="date" required>
<label style="line-height:1.6"><input id="completion-confirm" type="checkbox" required> I have checked the customer's account email and confirm this transaction is complete.</label>
<button id="completion-submit" class="btn btn-primary" type="submit">Record completed transaction</button></form>
<p id="completion-message" role="status" style="margin-top:18px;line-height:1.7"></p><a href="/broker/listings" class="btn btn-ghost" style="margin-top:16px">Back to my listings</a></div>
<script>
(()=>{
 const form=document.getElementById('completion-form'),date=document.getElementById('completion-date'),message=document.getElementById('completion-message'),button=document.getElementById('completion-submit');
 date.value=new Date(Date.now()+19800000).toISOString().slice(0,10);date.max=date.value;
 form.onsubmit=async event=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;message.textContent='Recording completed transaction…';try{
  const endpoint=location.pathname.replace(/\/complete$/,'/completion');
  const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_email:document.getElementById('completion-email').value.trim(),transaction_type:document.getElementById('completion-type').value,completed_on:date.value})});
  const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'Could not save completion');
  form.hidden=true;message.textContent='Recorded. This home now appears in the customer’s My Properties page.';
 }catch(error){message.textContent=error.message;button.disabled=false;}};
})();
</script>
